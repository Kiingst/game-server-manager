<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minecraft Server Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      text-align: center;
    }

    button, input[type="text"] {
      padding: 10px;
      margin: 10px;
      font-size: 16px;
    }

    input[type="text"] {
      width: 80%;
    }
  </style>
</head>
<body>
  <h1>Minecraft Server Manager</h1>

  <button onclick="sendStart()">Start Server</button>
  <button onclick="sendStop()">Stop Server</button>

  <h3>Send Minecraft Command</h3>
  <input type="text" id="mcCommand" placeholder="e.g. say Hello world">
  <br>
  <button onclick="sendCommand()">Send Command</button>

  <p id="response"></p>

  <script>
    async function sendStart() {
    const res = await fetch("/start", { method: "POST" });
    const data = await res.json();
    console.log(data);
  }

    async function sendStop() {
      const res = await fetch("/stop", { method: "POST" });
      const data = await res.json();
      document.getElementById("response").innerText = data.status || data.error;
    }

    async function sendCommand() {
      const command = document.getElementById("mcCommand").value;
      const res = await fetch("/command", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ command: command })
      });
      const data = await res.json();
      document.getElementById("response").innerText = data.status || data.error;
    }
  </script>
</body>
</html>
